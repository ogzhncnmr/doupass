name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Lint policies
        if: runner.os == 'Linux'
        run: go run ./cmd/doupass policy lint rules/starter.yml rules/packs/*.yml
      - name: Build wasm
        if: runner.os == 'Linux'
        run: GOOS=js GOARCH=wasm go build -o /tmp/doupass.wasm ./cmd/doupass-wasm
