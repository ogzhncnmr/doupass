name: Pages

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "cmd/doupass-wasm/**"
      - "internal/**"
      - "rules/starter.yml"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Build wasm
        run: |
          GOOS=js GOARCH=wasm go build -o web/doupass.wasm ./cmd/doupass-wasm
          cp "$(go env GOROOT)/lib/wasm/wasm_exec.js" web/wasm_exec.js
          cp rules/starter.yml web/starter.yml
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
