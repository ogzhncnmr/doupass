version: "0.1"
name: minimal

defaults:
  action: allow
  ask_fallback: deny
  ask_timeout_seconds: 60

audit:
  path: "~/.doupass/audit.jsonl"
  hash_chain: true

rules:
  - id: block-ssh-credentials
    match:
      args:
        "*": "**/.ssh/**"
    action: deny
    reason: "SSH credentials are off-limits"

  - id: block-aws-credentials
    match:
      args:
        "*": "**/.aws/**"
    action: deny
    reason: "AWS credentials are off-limits"

  - id: block-gcloud-credentials
    match:
      args:
        "*": "**/.config/gcloud/**"
    action: deny
    reason: "GCloud credentials are off-limits"

  - id: block-kubeconfig
    match:
      args:
        "*": "**/.kube/config"
    action: deny
    reason: "Kubernetes credentials are off-limits"

  - id: block-git-credentials
    match:
      args:
        "*": "**/.git-credentials"
    action: deny
    reason: "Stored git credentials are off-limits"

  - id: block-npmrc
    match:
      args:
        "*": "**/.npmrc"
    action: deny
    reason: "npm tokens are off-limits"

  - id: block-netrc
    match:
      args:
        "*": "**/.netrc"
    action: deny
    reason: "Stored FTP/HTTP credentials are off-limits"

  - id: block-env-files
    match:
      args:
        "*": "**/.env*"
    action: deny
    reason: "Environment files may contain secrets"

  - id: ask-npm-install
    match:
      surface: hook
      tool: Bash
      args:
        command: "*npm install*"
    action: ask
    reason: "Package installs run lifecycle scripts"

  - id: ask-rm-recursive
    match:
      surface: hook
      tool: Bash
      args:
        command: "*rm -rf*"
    action: ask
    reason: "Recursive delete needs confirmation"
