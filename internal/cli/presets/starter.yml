version: "0.1"
name: starter

defaults:
  action: allow
  ask_fallback: deny
  ask_timeout_seconds: 60

audit:
  path: "~/.doupass/audit.jsonl"
  hash_chain: true

rules:
  - id: block-ssh-credentials
    match:
      args:
        "*": "**/.ssh/**"
    action: deny
    reason: "SSH keys and configs are off-limits"

  - id: block-aws-credentials
    match:
      args:
        "*": "**/.aws/**"
    action: deny
    reason: "AWS credentials are off-limits"

  - id: block-gcloud-credentials
    match:
      args:
        "*": "**/.config/gcloud/**"
    action: deny
    reason: "GCloud credentials are off-limits"

  - id: block-azure-credentials
    match:
      args:
        "*": "**/.azure/**"
    action: deny
    reason: "Azure credentials are off-limits"

  - id: block-kubeconfig
    match:
      args:
        "*": "**/.kube/config"
    action: deny
    reason: "Kubernetes credentials are off-limits"

  - id: block-docker-config
    match:
      args:
        "*": "**/.docker/config.json"
    action: deny
    reason: "Registry credentials are off-limits"

  - id: block-git-credentials
    match:
      args:
        "*": "**/.git-credentials"
    action: deny
    reason: "Stored git credentials are off-limits"

  - id: block-npmrc
    match:
      args:
        "*": "**/.npmrc"
    action: deny
    reason: "npm tokens are off-limits"

  - id: block-netrc
    match:
      args:
        "*": "**/.netrc"
    action: deny
    reason: "Stored FTP/HTTP credentials are off-limits"

  - id: block-gnupg
    match:
      args:
        "*": "**/.gnupg/**"
    action: deny
    reason: "PGP private keys are off-limits"

  - id: block-password-store
    match:
      args:
        "*": "**/.password-store/**"
    action: deny
    reason: "Password stores are off-limits"

  - id: block-terraform-state
    match:
      args:
        "*": "**/*.tfstate*"
    action: deny
    reason: "Terraform state may contain secrets"

  - id: block-private-key-rsa
    match:
      args:
        "*": "**/id_rsa"
    action: deny
    reason: "Private keys must stay in ~/.ssh"

  - id: block-private-key-ed25519
    match:
      args:
        "*": "**/id_ed25519"
    action: deny
    reason: "Private keys must stay in ~/.ssh"

  - id: block-env-files
    match:
      args:
        "*": "**/.env*"
    action: deny
    reason: "Environment files may contain secrets"

  - id: block-shadow-file
    match:
      args:
        "*": "**/etc/shadow"
    action: deny
    reason: "System credential file"

  - id: deny-rm-root
    match:
      surface: hook
      tool: Bash
      args:
        command: "*rm -rf /*"
    action: deny
    reason: "Refusing recursive delete of root paths"

  - id: deny-gh-auth-token
    match:
      surface: hook
      tool: Bash
      args:
        command: "*gh auth token*"
    action: deny
    reason: "GitHub CLI tokens must not be read by agents"

  - id: ask-rm-recursive
    match:
      surface: hook
      tool: Bash
      args:
        command: "*rm -rf*"
    action: ask
    reason: "Recursive delete needs confirmation"

  - id: ask-package-install
    match:
      surface: hook
      tool: Bash
      args:
        command: re:.*(npm|yarn|pnpm|bun)\s+(install|i|add)\b.*|.*(pip3?|gem|cargo|go)\s+install\b.*
    action: ask
    reason: "Package installs run lifecycle scripts"

  - id: ask-git-force-push
    match:
      surface: hook
      tool: Bash
      args:
        command: re:.*git\s+push\b.*(--force\b|--force-with-lease\b|\s-f\b).*
    action: ask
    reason: "Force push may destroy remote history"

  - id: ask-curl-data
    match:
      surface: hook
      tool: Bash
      args:
        command: "*curl*-d*"
    action: ask
    reason: "POSTing data with curl can exfiltrate files"

  - id: ask-curl-pipe-shell
    match:
      surface: hook
      tool: Bash
      args:
        command: re:.*\b(curl|wget)\b.*\|\s*(sudo\s+)?(ba|z|da|fi|k)?sh\b.*
    action: ask
    reason: "Piping a download straight into a shell runs unverified code"

  - id: ask-remote-copy
    match:
      surface: hook
      tool: Bash
      args:
        command: re:.*\b(scp|sftp|rsync)\b.*\b(\w+@)?[\w.-]+:.*
    action: ask
    reason: "Outbound file transfers need confirmation"

  - id: ask-base64-pipe
    match:
      surface: hook
      tool: Bash
      args:
        command: re:.*\|\s*base64\b.*
    action: ask
    reason: "Encoding data through a pipe is a common exfiltration step"

  - id: ask-npm-publish
    match:
      surface: hook
      tool: Bash
      args:
        command: re:.*\b(npm|yarn|pnpm|bun)\s+publish\b.*
    action: ask
    reason: "Publishing a package is effectively irreversible"

  - id: deny-drop-table
    match:
      args:
        "*": "*DROP TABLE*"
    action: deny
    reason: "Destructive SQL is not allowed"

  - id: deny-drop-database
    match:
      args:
        "*": "*DROP DATABASE*"
    action: deny
    reason: "Destructive SQL is not allowed"

  - id: allow-workspace
    match:
      args:
        "*": "${WORKSPACE}/**"
    action: allow
    reason: "Workspace access is expected"
