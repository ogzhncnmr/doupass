version: "0.1"
name: red-team

defaults:
  action: allow
  ask_fallback: allow
  ask_timeout_seconds: 30

audit:
  path: "~/.doupass/audit.jsonl"
  hash_chain: true

rules:
  - id: block-credential-exfil
    match:
      args:
        "*": "**/.ssh/**"
    action: deny
    reason: "No credential exfiltration, even in red team"

  - id: log-network-egress
    match:
      surface: hook
      tool: Bash
      args:
        command: "*curl*"
    action: log
    reason: "Network egress is recorded"

  - id: ask-destructive
    match:
      surface: hook
      tool: Bash
      args:
        command: "*rm -rf*"
    action: ask
    reason: "Destructive commands need confirmation even here"
