version: "0.1"
name: starter

defaults:
  action: allow
  ask_fallback: deny
  ask_timeout_seconds: 60

audit:
  path: "~/.doupass/audit.jsonl"
  hash_chain: true

rules:
  - id: block-ssh-credentials
    match:
      args:
        "*": "**/.ssh/**"
    action: deny
    reason: "SSH keys and configs are off-limits"

  - id: block-aws-credentials
    match:
      args:
        "*": "**/.aws/**"
    action: deny
    reason: "AWS credentials are off-limits"

  - id: block-gcloud-credentials
    match:
      args:
        "*": "**/.config/gcloud/**"
    action: deny
    reason: "GCloud credentials are off-limits"

  - id: block-kubeconfig
    match:
      args:
        "*": "**/.kube/config"
    action: deny
    reason: "Kubernetes credentials are off-limits"

  - id: block-docker-config
    match:
      args:
        "*": "**/.docker/config.json"
    action: deny
    reason: "Registry credentials are off-limits"

  - id: block-git-credentials
    match:
      args:
        "*": "**/.git-credentials"
    action: deny
    reason: "Stored git credentials are off-limits"

  - id: block-npmrc
    match:
      args:
        "*": "**/.npmrc"
    action: deny
    reason: "npm tokens are off-limits"

  - id: block-env-files
    match:
      args:
        "*": "**/.env*"
    action: deny
    reason: "Environment files may contain secrets"

  - id: block-shadow-file
    match:
      args:
        "*": "**/etc/shadow"
    action: deny
    reason: "System credential file"

  - id: deny-rm-root
    match:
      surface: hook
      tool: Bash
      args:
        command: "*rm -rf /*"
    action: deny
    reason: "Refusing recursive delete of root paths"

  - id: ask-rm-recursive
    match:
      surface: hook
      tool: Bash
      args:
        command: "*rm -rf*"
    action: ask
    reason: "Recursive delete needs confirmation"

  - id: ask-package-install
    match:
      surface: hook
      tool: Bash
      args:
        command: re:.*(npm|yarn|pnpm|bun)\s+(install|i|add)\b.*|.*(pip3?|gem|cargo|go)\s+install\b.*
    action: ask
    reason: "Package installs run lifecycle scripts"

  - id: ask-git-force-push
    match:
      surface: hook
      tool: Bash
      args:
        command: re:.*git\s+push\b.*(--force\b|--force-with-lease\b|\s-f\b).*
    action: ask
    reason: "Force push may destroy remote history"

  - id: ask-curl-data
    match:
      surface: hook
      tool: Bash
      args:
        command: "*curl*-d*"
    action: ask
    reason: "POSTing data with curl can exfiltrate files"

  - id: ask-base64-pipe
    match:
      surface: hook
      tool: Bash
      args:
        command: re:.*\|\s*base64\b.*
    action: ask
    reason: "Encoding data through a pipe is a common exfiltration step"

  - id: deny-drop-table
    match:
      args:
        "*": "*DROP TABLE*"
    action: deny
    reason: "Destructive SQL is not allowed"

  - id: deny-drop-database
    match:
      args:
        "*": "*DROP DATABASE*"
    action: deny
    reason: "Destructive SQL is not allowed"

  - id: allow-workspace
    match:
      args:
        "*": "${WORKSPACE}/**"
    action: allow
    reason: "Workspace access is expected"
